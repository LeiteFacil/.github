<svg xmlns="http://www.w3.org/2000/svg" viewBox="564.565 88.49 275.255 232.315" width="275.255" height="232.315">
<style>
  /* Retro idle bob — choppy on purpose (8-bit feel) */
  @keyframes lf-bob {
    0%   { transform: translateY(0)    scaleY(1);    }
    25%  { transform: translateY(-7px) scaleY(1.02); }
    50%  { transform: translateY(-10px) scaleY(1);   }
    75%  { transform: translateY(-7px) scaleY(0.98); }
    100% { transform: translateY(0)    scaleY(1);    }
  }
  /* Subtle CRT flicker */
  @keyframes lf-flick {
    0%, 96%, 100% { opacity: 1;    }
    97%           { opacity: 0.78; }
    98%           { opacity: 1;    }
    99%           { opacity: 0.88; }
  }
  /* Scanline sweeping down the figure */
  @keyframes lf-scan {
    0%   { transform: translateY(-30px); opacity: 0;   }
    10%  { opacity: 0.35; }
    90%  { opacity: 0.35; }
    100% { transform: translateY(245px); opacity: 0;   }
  }
  .lf-mascot {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: lf-bob 1.4s steps(6, end) infinite,
               lf-flick 5s linear infinite;
  }
  .lf-scanline { animation: lf-scan 3.2s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .lf-mascot, .lf-scanline { animation: none; }
    .lf-scanline { opacity: 0; }
  }
</style>
